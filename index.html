<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Employee Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
 font-family:Arial,sans-serif;
 background:#f4f6f9;
 padding:20px;
}

.container{
 max-width:500px;
 margin:auto;
}

#reader{
 background:#ffffff;
 border-radius:10px;
 overflow:hidden;
}

.card{
 margin-top:20px;
 padding:15px;
 border-radius:10px;
 font-size:18px;
}

.success{
 background:#d4edda;
 color:#155724;
}

.warning{
 background:#fff3cd;
 color:#856404;
}

.error{
 background:#f8d7da;
 color:#721c24;
}

</style>

</head>

<body>

<div class="container">

<h2>ระบบสแกนพนักงาน</h2>

<div id="reader"></div>

<div id="result"></div>

</div>

<script>

/* -------------------- */
/* แก้ URL ตรงนี้ */
/* -------------------- */

const API_URL =
"https://script.google.com/macros/s/AKfycby4ZyIHdoGnWXO4qiYJ3-Xt7ZyULB88Iw5UeadgVWOCs61cAAjTJZpzglE9kXh_BLm3/exec";

/* -------------------- */

let scanning = false;

async function sendData(empId){

 try{

   const response = await fetch(
      API_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          empId:empId
        })
      }
   );

   const data =
      await response.json();

   showResult(data);

 }
 catch(error){

   console.error(error);

   document.getElementById("result")
   .innerHTML = `
   <div class="card error">
   ❌ เชื่อมต่อ API ไม่สำเร็จ
   </div>
   `;
 }

}

function showResult(data){

 let html = "";

 if(data.status === "SUCCESS"){

   html = `
   <div class="card success">

      ✅ บันทึกสำเร็จ

      <br><br>

      <b>รหัส :</b>
      ${data.employee.empId}

      <br>

      <b>ชื่อ :</b>
      ${data.employee.name}

      <br>

      <b>แผนก :</b>
      ${data.employee.department}

   </div>
   `;
 }

 else if(data.status === "DUPLICATE"){

   html = `
   <div class="card warning">

      ⚠ พนักงานสแกนแล้ววันนี้

      <br><br>

      ${data.employee.name}

   </div>
   `;
 }

 else if(data.status === "NOTFOUND"){

   html = `
   <div class="card error">

      ❌ ไม่พบข้อมูลพนักงาน

   </div>
   `;
 }

 else{

   html = `
   <div class="card error">

      ❌ เกิดข้อผิดพลาด

   </div>
   `;
 }

 document.getElementById("result")
 .innerHTML = html;

 setTimeout(()=>{
    scanning = false;
 },3000);

}

function onScanSuccess(code){

 if(scanning){
   return;
 }

 scanning = true;

 sendData(code);

}

const scanner =
new Html5Qrcode("reader");

scanner.start(
 {
   facingMode:"environment"
 },
 {
   fps:10,
   qrbox:250,
   formatsToSupport:[
     Html5QrcodeSupportedFormats.QR_CODE,
     Html5QrcodeSupportedFormats.CODE_128,
     Html5QrcodeSupportedFormats.CODE_39,
     Html5QrcodeSupportedFormats.EAN_13
   ]
 },
 onScanSuccess
);

</script>

</body>

</html>
